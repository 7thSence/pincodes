<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GSK Agent Hub — Centralized tools for call center agents. Pincodes, article codes, IBASE, and more." />
    <title>GSK Agent Hub</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>

    <!-- Navigation -->
    <nav class="nav-bar">
      <div class="nav-inner">
        <a href="index.html" class="nav-brand">
          <div class="nav-brand-icon">⚡</div>
          <div class="nav-brand-text"><span>GSK</span> Agent Hub</div>
        </a>
      </div>
    </nav>

    <!-- Header -->
    <header class="page-header animate-in">
      <h1>Your <span class="gradient-text">Agent Toolkit</span></h1>
      <p class="subtitle">Everything you need while handling calls — all in one place.</p>
    </header>

    <!-- Dashboard Icon Grid -->
    <section class="dashboard-grid" id="dashboardGrid">

      <!-- Tile 1: Pincodes -->
      <a href="pincodes.html" class="tile-link" id="tile-pincodes">
        <div class="dashboard-tile tile-purple animate-in animate-in-delay-1">
          <div class="tile-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <span class="tile-label">Pincodes</span>
          <span class="tile-desc">Search service provider</span>
        </div>
      </a>

      <!-- Tile 2: Article Codes / IBASE -->
      <a href="article-codes.html" class="tile-link" id="tile-article-codes">
        <div class="dashboard-tile tile-blue animate-in animate-in-delay-2">
          <div class="tile-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <span class="tile-label">Article Codes</span>
          <span class="tile-desc">IBASE reference</span>
        </div>
      </a>


      <!-- Tile 8: Series 6 -->
      <a href="series-6.html" class="tile-link" id="tile-series-6">
        <div class="dashboard-tile tile-teal animate-in animate-in-delay-3">
          <div class="tile-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </div>
          <span class="tile-label">Series 6</span>
          <span class="tile-desc">Reference guide</span>
        </div>
      </a>

    </section>

    <!-- Footer -->
    <footer class="dashboard-footer">
      GSK Agent Hub &middot; Internal Use Only
    </footer>

    <script src="js/dashboard.js"></script>
  </body>
</html>
